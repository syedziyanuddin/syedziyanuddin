<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Syed Ziyanuddin — Until the next build</title>
  <desc id="footer-desc">A restrained midnight navy footer with cyan orbital details and a short signoff from Syed Ziyanuddin.</desc>
  <style>
    .footer-orbit { animation: footer-orbit 28s linear infinite; transform-origin: 600px 72px; }
    .footer-pulse { animation: footer-pulse 3.6s ease-in-out infinite; }
    @keyframes footer-orbit { to { transform: rotate(360deg); } }
    @keyframes footer-pulse { 0%, 100% { opacity: .38; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .footer-orbit, .footer-pulse { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="footer-bg" x1="0" y1="0" x2="1200" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111f"/>
      <stop offset=".5" stop-color="#0a1c30"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="footer-aura" cx="0" cy="0" r="1" gradientTransform="translate(600 76) rotate(90) scale(92 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="footer-line" x1="484" y1="0" x2="716" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="footer-clip">
      <rect width="1200" height="144" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footer-clip)">
    <rect width="1200" height="144" fill="url(#footer-bg)"/>
    <rect width="1200" height="144" fill="url(#footer-aura)"/>
    <path d="M0 109C150 80 260 134 407 111C510 95 561 106 600 118C639 106 690 95 793 111C940 134 1050 80 1200 109" fill="none" stroke="#38bdf8" stroke-opacity=".13"/>
    <path d="M0 118C160 89 270 144 417 120C514 104 563 116 600 126C637 116 686 104 783 120C930 144 1040 89 1200 118" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>

    <g aria-hidden="true">
      <ellipse cx="600" cy="72" rx="153" ry="33" fill="none" stroke="#67e8f9" stroke-opacity=".18"/>
      <ellipse cx="600" cy="72" rx="93" ry="20" fill="none" stroke="#38bdf8" stroke-opacity=".16" stroke-dasharray="4 8"/>
      <g class="footer-orbit">
        <circle cx="600" cy="39" r="3" fill="#67e8f9"/>
        <circle cx="600" cy="39" r="7" fill="none" stroke="#67e8f9" stroke-opacity=".32" class="footer-pulse"/>
      </g>
      <g class="footer-orbit">
        <circle cx="747" cy="72" r="2.5" fill="#38bdf8"/>
      </g>
      <path d="M484 72H518M682 72H716" stroke="#67e8f9" stroke-opacity=".3"/>
      <circle cx="472" cy="72" r="2" fill="#67e8f9" class="footer-pulse"/>
      <circle cx="728" cy="72" r="2" fill="#67e8f9" class="footer-pulse"/>
    </g>

    <path d="M484 51H716" stroke="url(#footer-line)" stroke-width="1"/>
    <text x="600" y="76" text-anchor="middle" fill="#e0f7ff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing=".2">Until the next build.</text>
    <text x="600" y="101" text-anchor="middle" fill="#8fb8d5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="2.2">SYED ZIYANUDDIN</text>

    <path d="M57 44H103M57 44V90M1097 44H1143M1143 44V90" fill="none" stroke="#67e8f9" stroke-opacity=".24"/>
    <circle cx="57" cy="44" r="2" fill="#67e8f9"/>
    <circle cx="1143" cy="44" r="2" fill="#38bdf8"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="143" rx="19.5" fill="none" stroke="#7dd3fc" stroke-opacity=".18"/>
</svg>
